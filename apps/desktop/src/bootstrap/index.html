<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>OpenCreator</title>
    <link rel="stylesheet" href="./style.css" />
  </head>
  <body>
    <div class="desktop-window-controls" role="group" aria-label="Window controls" hidden>
      <button type="button" data-action="close" aria-label="Close window" title="Close window"><span aria-hidden="true">×</span></button>
      <button type="button" data-action="minimize" aria-label="Minimize window" title="Minimize window"><span aria-hidden="true">−</span></button>
      <button type="button" data-action="zoom" aria-label="Zoom window" title="Zoom window"><span aria-hidden="true">+</span></button>
    </div>
    <main class="bootstrap-shell">
      <section class="bootstrap-panel" aria-live="polite">
        <span class="brand-name">OpenCreator</span>
        <div class="status-mark" id="status-mark" aria-hidden="true">
          <span></span>
        </div>
        <h1 id="status-title">Đang chuẩn bị OpenCreator</h1>
        <p id="status-detail">Đang kiểm tra môi trường cục bộ</p>
        <p class="elapsed" id="elapsed" hidden></p>

        <div class="failure-actions" id="failure-actions" hidden>
          <button class="primary" id="retry" type="button">Thử lại</button>
          <button id="select-codex" type="button">Chọn Codex hoặc ChatGPT</button>
          <button id="diagnostics" type="button">Xuất chẩn đoán</button>
          <button class="quiet" id="quit" type="button">Thoát</button>
        </div>

        <div class="failure-actions" id="workspace-actions" hidden>
          <button class="primary" id="reload-workspace" type="button">Tải lại Bảng điều khiển</button>
          <button id="restart-runtime" type="button">Khởi động lại Runtime</button>
          <button id="workspace-diagnostics" type="button">Xuất chẩn đoán</button>
          <button class="quiet" id="workspace-quit" type="button">Thoát</button>
        </div>

        <details id="technical-details" hidden>
          <summary>Chi tiết kỹ thuật</summary>
          <dl>
            <div><dt>Codex</dt><dd id="codex-path">-</dd></div>
            <div><dt>CODEX_HOME</dt><dd id="codex-home">-</dd></div>
            <div><dt>Mã lỗi</dt><dd id="error-code">-</dd></div>
          </dl>
          <pre id="error-message"></pre>
        </details>
      </section>
    </main>
    <script type="module" src="./main.ts"></script>
  </body>
</html>
